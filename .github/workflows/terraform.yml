name: "Terraform Deployment Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'environment/prod/**'
      - 'Child_modules/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'environment/prod/**'
      - 'Child_modules/**'
  workflow_dispatch:

permissions:
  id-token: write   # Azure OIDC Authentication ke liye
  contents: read
  pull-requests: write # Infracost PR comment add karne ke liye

jobs:
  terraform:
    name: "Terraform Plan, Cost & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Azure OIDC Login Setup (Updated with your Azure IDs)
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: "c250a887-83bb-4856-96ee-b7916896f079"
          tenant-id: "9fc55e6c-fd66-4dc3-8291-4392a2ad8c35"
          subscription-id: "6e087706-38d2-46e4-b4f9-39ceebf097a2"

      # Setup Terraform CLI
      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Step 1: Infracost Setup (Updated with your API Key)
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: "ico-xLYWa7sJ57LV5Ao49crw6ysYRVlZdRAX"

      # Step 2: Terraform Format Check
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      # Step 3: Terraform Init
      - name: Terraform Init
        id: init
        run: terraform init

      # Step 4: Terraform Validate
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Step 5: Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false

      # Step 6: Infracost Cost Estimation
      - name: Generate Infracost Cost Estimate
        run: |
          infracost breakdown --path . \
                              --format json \
                              --out-file /tmp/infracost.json

      # Step 7: Post Infracost Comment on Pull Request
      - name: Post Infracost Comment
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update

      # Step 8: Terraform Apply (Sirf main/master branch push par chalega)
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false